name: Android build
run-name: "Android • ${{ inputs.target || 'release_apk' }} • ${{ inputs.ref || github.ref_name }}"

on:
  push:
    branches:
      - feature/domain-split-tunneling
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        required: true
        default: release_apk
        options:
        - release_apk
        - release_aab
        - debug_apk
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "feature/domain-split-tunneling"

jobs:
  build:
    name: "Build (${{ inputs.target || 'release_apk' }})"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure build
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        TARGET="${TARGET:-release_apk}"
        case "$TARGET" in
          release_apk)
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "kind=apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-apk" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=./ui/build/outputs/apk/release/ui-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            ;;
          release_aab)
            echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
            echo "kind=aab" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-aab" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=./ui/build/outputs/bundle/release/ui-release.aab" >> "$GITHUB_OUTPUT"
            ;;
          debug_apk)
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "kind=apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=debug-apk" >> "$GITHUB_OUTPUT"
            echo "needs_signing=false" >> "$GITHUB_OUTPUT"
            echo "apk_path=./ui/build/outputs/apk/debug/ui-debug.apk" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown target: $TARGET" >&2
            exit 1
            ;;
        esac

    - name: Decode keystore
      if: steps.cfg.outputs.needs_signing == 'true'
      shell: bash
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        echo "${KEYSTORE_B64}" | base64 --decode > release.keystore.jks
        echo "KEYSTORE_PATH=${PWD}/release.keystore.jks" >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace ${{ steps.cfg.outputs.gradle_task }}

    - name: Sign APK
      if: steps.cfg.outputs.needs_signing == 'true' && steps.cfg.outputs.kind == 'apk'
      id: sign_apk
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        set -euo pipefail
        UNSIGNED="${{ steps.cfg.outputs.apk_path }}"
        SIGNED="${UNSIGNED/-unsigned/}"
        SIGNED="${SIGNED%.apk}-signed.apk"

        $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
          --ks "${KEYSTORE_PATH}" \
          --ks-pass "pass:${KEYSTORE_PASSWORD}" \
          --ks-key-alias "${KEY_ALIAS}" \
          --key-pass "pass:${KEYSTORE_PASSWORD}" \
          --out "${SIGNED}" \
          "${UNSIGNED}"

        echo "signed_file=${SIGNED}" >> "$GITHUB_OUTPUT"

    - name: Sign AAB
      if: steps.cfg.outputs.needs_signing == 'true' && steps.cfg.outputs.kind == 'aab'
      id: sign_aab
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        set -euo pipefail
        AAB="${{ steps.cfg.outputs.apk_path }}"
        SIGNED="${AAB%.aab}-signed.aab"
        jarsigner \
          -keystore "${KEYSTORE_PATH}" \
          -storepass "${KEYSTORE_PASSWORD}" \
          -signedjar "${SIGNED}" \
          "${AAB}" \
          "${KEY_ALIAS}"
        echo "signed_file=${SIGNED}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cfg.outputs.artifact_name }}
        path: ${{ steps.sign_apk.outputs.signed_file || steps.sign_aab.outputs.signed_file || steps.cfg.outputs.apk_path }}
        if-no-files-found: error
